</style></head><body><div class="shell"><aside class="sidebar"><div class="topbar"><div class="brand"><em id="brand-icon">🏮</em><div>まちめし<span class="caption">学園祭・子ども食堂・炊き出し・地域イベント共用</span></div></div><div class="tools"><span class="badge" id="sync">読み込み中</span><button class="btn secondary" id="staff-toggle">スタッフ端末</button><button class="btn secondary" id="help">使い方</button></div></div><div class="kind-tabs" id="kind-tabs"></div></aside><div class="nav-wrap"><nav id="nav"></nav></div><main><header><div><h1 id="title"></h1><div class="muted" id="subtitle"></div></div><span id="mode" class="mode-label"></span></header><div class="audio-toolbar" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px"><span id="audio-status" class="muted" role="status">音を有効にしてください</span><button id="enable-audio" class="btn secondary">音を有効にする</button></div><div id="app"></div></main></div><div id="toast" class="toast hidden" role="status"></div><dialog id="dialog"><div id="dialog-body"></div><button class="btn secondary full" id="close-dialog" style="margin-top:20px">閉じる</button></dialog><script>
(function(root){
'use strict';
const ST=['受付済み','調理中','受渡し待ち','完了','取消'];
const defaults={name:'まちの食堂',kind:'地域イベント',menu:[{id:'curry',name:'野菜カレー',price:400,emoji:'🍛',available:true},{id:'rice',name:'おにぎりセット',price:250,emoji:'🍙',available:true},{id:'soup',name:'具だくさん豚汁',price:200,emoji:'🥣',available:true},{id:'tea',name:'お茶',price:100,emoji:'🍵',available:true}]};
const METHODS=[{id:'cash',name:'現金',kind:'cash'},{id:'paypay',name:'PayPay',kind:'qr'},{id:'aupay',name:'au PAY',kind:'qr'},{id:'rakuten',name:'楽天ペイ',kind:'qr'},{id:'dbarai',name:'d払い',kind:'qr'},{id:'barcode',name:'バーコード決済（店舗の対応端末）',kind:'barcode'}];
const UNKNOWN={id:'unspecified',name:'未指定',kind:'unknown'};
const PAY_ST={unpaid:'未払い',paid:'支払済み',refund_pending:'返金待ち',refunded:'返金済み',not_required:'支払不要'};
const paymentDefaults=METHODS.map(m=>({...m,enabled:['cash','paypay'].includes(m.id),qrImage:'',instructions:''}));
const str=(v,n)=>typeof v==='string'&&v.length<=n,integer=v=>Number.isSafeInteger(v)&&v>=0;
const method=id=>({...METHODS.find(m=>m.id===id)||UNKNOWN});
const validMethod=m=>!!m&&[...METHODS,UNKNOWN].some(x=>x.id===m.id&&x.name===m.name&&x.kind===m.kind);
const validImage=v=>str(v,44000)&&(v===''||/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/]+={0,2}$/.test(v));
const validOption=o=>!!o&&METHODS.some(m=>m.id===o.id)&&typeof o.enabled==='boolean'&&str(o.instructions,160)&&validImage(o.qrImage)&&(method(o.id).kind==='qr'||!o.qrImage);
function valid(e){
 if(!e||!str(e.id,100)||!e.id||!str(e.actor,80)||!Number.isFinite(e.at)||!Number.isInteger(e.clock)||e.clock<0)return false;
 if(e.notificationSilent!==undefined&&typeof e.notificationSilent!=='boolean')return false;
 if(e.type==='order')return (e.customerId===undefined||(str(e.customerId,100)&&!!e.customerId))&&(e.paymentMethod===undefined||validMethod(e.paymentMethod))&&str(e.orderId,100)&&!!e.orderId&&str(e.label,60)&&str(e.note,300)&&Array.isArray(e.items)&&e.items.length>0&&e.items.length<=50&&e.items.every(i=>str(i.id,100)&&str(i.name,80)&&str(i.emoji,10)&&Number.isInteger(i.price)&&i.price>=0&&i.price<=1000000&&Number.isInteger(i.qty)&&i.qty>0&&i.qty<=999);
 if(e.type==='status')return str(e.orderId,100)&&ST.includes(e.status);
 if(e.type==='config')return e.config&&str(e.config.name,60)&&str(e.config.kind,30)&&Array.isArray(e.config.menu)&&e.config.menu.length<=50&&e.config.menu.length>0&&new Set(e.config.menu.map(i=>i.id)).size===e.config.menu.length&&e.config.menu.every(i=>str(i.id,100)&&str(i.name,80)&&i.name.trim()&&str(i.emoji,10)&&Number.isInteger(i.price)&&i.price>=0&&i.price<=1000000&&typeof i.available==='boolean');
 if(e.type==='payment_option')return validOption(e.option);
 if(e.type==='payment')return str(e.orderId,100)&&['unpaid','paid','refund_pending','refunded'].includes(e.status)&&validMethod(e.method)&&integer(e.amount)&&(e.cashReceived===undefined||integer(e.cashReceived))&&str(e.reference,80)&&str(e.note,200);
 return false;
}
const total=o=>o.items.reduce((s,i)=>s+i.price*i.qty,0),qty=o=>o.items.reduce((s,i)=>s+i.qty,0);
function paymentView(o){
 const p=o.payment||{status:'unpaid',method:o.paymentMethod||UNKNOWN};
 const status=total(o)===0?'not_required':o.status==='取消'&&p.status==='paid'?'refund_pending':p.status;
 return {...p,status,label:PAY_ST[status],method:{...p.method},cashChange:p.status==='paid'&&p.method.id==='cash'?p.cashReceived-total(o):null};
}

const ACCESS_KEY='machimeshi-access-v1';

try{const saved=JSON.parse(localStorage.getItem(ACCESS_KEY)||'null');if(saved&&Number.isInteger(saved.taps)&&saved.taps>=1&&saved.taps<=20&&typeof saved.password==='string'&&saved.password.length>=4)access=saved;}catch{}
function staffLogin(){
 const now=Date.now();tapCount=now-tapTime>3000?1:tapCount+1;tapTime=now;
 if(tapCount<access.taps)return;tapCount=0;

 $('#staff-password').focus();$('#staff-login').onsubmit=e=>{e.preventDefault();if($('#staff-password').value!==access.password){$('#login-error').textContent='パスワードが違います。';$('#staff-password').value='';$('#staff-password').focus();return;}void alerts.unlock();staff=true;page='board';$('#dialog').close();render();};
}
function accessSettings(){return `<section class="panel" style="margin-bottom:20px"><h2>スタッフ端末の切替設定</h2><p class="muted">この端末に保存します。起動するたびに顧客注文画面に戻ります。連続タップの間隔は3秒以内です。</p><form id="access-settings"><label for="access-taps">タップ回数（1〜20回）</label><input id="access-taps" type="number" min="1" max="20" step="1" required value="${access.taps}"><label for="access-current">現在のパスワード</label><input id="access-current" class="full" type="password" autocomplete="current-password" required><label for="access-new">新しいパスワード（4〜128文字・空欄なら変更なし）</label><input id="access-new" class="full" type="password" minlength="4" maxlength="128" autocomplete="new-password"><label for="access-confirm">新しいパスワードの確認</label><input id="access-confirm" class="full" type="password" maxlength="128" autocomplete="new-password"><button type="submit" class="btn full" style="margin-top:16px">切替設定を保存</button></form></section>`;}
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
const alerts=MealAlerts.create({storage:localStorage,AudioContext:window.AudioContext||window.webkitAudioContext,randomId:uid,onState:updateAudioStatus});
function updateAudioStatus(){
 const b=$('#enable-audio'),label=$('#audio-status');if(!b||!label)return;
 const config=alerts.settings,enabled=(staff?(config.order||config.ready):config.ready)&&config.volume>0;

 b.onclick=async()=>{const ok=await alerts.unlock();if(ok){alerts.play(staff&&config.order?'order':'ready');toast('通知音を有効にしました。音が聞こえるか確認してください。');}else toast('音を有効にできません。端末の音量・再生設定を確認してください。');};
}
function audioSettings(){const a=alerts.settings;return `<section class="panel" style="margin-bottom:20px"><h2>この端末の通知音</h2><form id="audio-settings"><label><input id="audio-order" type="checkbox" ${a.order?'checked':''}> 新規注文音（スタッフ画面）</label><label><input id="audio-ready" type="checkbox" ${a.ready?'checked':''}> 受渡し音（スタッフ画面と、この端末の顧客注文）</label><label for="audio-volume">音量 <output id="audio-volume-value">${a.volume}</output>％</label><input id="audio-volume" class="full" type="range" min="0" max="100" step="1" value="${a.volume}"><button type="submit" class="btn" style="margin-top:14px">通知音設定を保存</button></form><div class="tools" style="margin-top:14px"><button id="test-order-sound" class="btn secondary">新規注文音を試聴</button><button id="test-ready-sound" class="btn secondary">受渡し音を試聴</button></div><p class="muted">設定を保存してから試聴してください。0％またはオフの音は鳴りません。この端末だけに保存します。他の端末を変更する場合は、その端末のスタッフ設定を開いてください。</p><p class="muted">アプリを開いている間の通知です。消音・画面ロック・バックグラウンドでは鳴らない場合があります。お客様は注文した同じ端末でこのアプリを開いたままお待ちください。</p></section>`;}
function customerOrdersView(){
 if(staff)return '';
 const orders=state.orders.filter(o=>o.customerId===alerts.customerId).slice(0,10),waiting=pending.filter(e=>e.type==='order'&&e.customerId===alerts.customerId);
 if(!alerts.identityPersisted)return '<section class="panel" role="alert"><h2>呼出し先の保存ができません</h2><p>この起動中に登録した注文は通知できますが、再起動後は呼出し先を引き継げません。端末の保存設定を確認し、受付番号でも受渡しをご確認ください。</p></section>';

}
function notifyChanges(before,fresh){

 if(change.order.length){alerts.play('order');toast('新規注文：'+change.order.join('、'));}
 if(change.ready.length){alerts.play('ready');toast('受渡し待ち：'+change.ready.join('、')+' ／ お受取りの準備ができました。');}
}
document.addEventListener?.('click',()=>{if(alerts.audioState!=='running'&&((staff&&alerts.settings.order)||alerts.settings.ready))void alerts.unlock();},{capture:true});
document.addEventListener?.('keydown',()=>{if(alerts.audioState!=='running'&&((staff&&alerts.settings.order)||alerts.settings.ready))void alerts.unlock();},{capture:true});
const money=n=>'¥'+n.toLocaleString('ja-JP'), day=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}, time=t=>new Date(t).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});

function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>$('#toast').classList.add('hidden'),4500)}
function persist(){try{if(!host)localStorage.setItem(KEY,JSON.stringify(events));else localStorage.setItem(PENDING,JSON.stringify(pending))}catch{toast('端末への一時保存ができません。終了前にJSONを書き出してください。')}}
function merge(es){const before=state,fresh=[];const ids=new Set(events.map(e=>e.id));for(const e of es){if(C.valid(e)){clock=Math.max(clock,e.clock);if(!ids.has(e.id)){events.push(e);fresh.push(e);ids.add(e.id)}}}state=C.reduce(events);pending=pending.filter(e=>!ids.has(e.id));persist();render();if(ready)notifyChanges(before,fresh)}
function event(type,data){return{id:uid(),at:Date.now(),clock:++clock,actor:actor(),type,...data}}
function submit(es){if(!ready)throw Error('履歴の読み込み完了を待ってください。');if(!host){merge(es);return}for(const e of es){if(!pending.some(x=>x.id===e.id)&&!events.some(x=>x.id===e.id))pending.push(e)}persist();render();flush()}
let flushing=false;async function flush(){if(flushing||!host||!ready||!pending.length)return;flushing=true;try{const wait=Math.max(0,(webxdc.sendUpdateInterval??10000)-(Date.now()-lastSend));if(wait)await new Promise(r=>setTimeout(r,wait));let batch=[],limit=Math.min(webxdc.sendUpdateMaxSize||128000,60000);for(const e of pending){if(new TextEncoder().encode(JSON.stringify({payload:{app:'machimeshi/1',events:[...batch,e]}})).length>limit)break;batch.push(e)}if(!batch.length)throw Error('送信上限を超えました。');lastSend=Date.now();webxdc.sendUpdate({payload:{app:'machimeshi/1',events:batch},summary:'注文台帳を更新'},'');}catch(e){toast('送信を確認できません：'+e.message)}finally{flushing=false;/* wait for listener echo before next batch */}}
function scoped(){return state.orders.filter(o=>(!date||day(o.at)===date)&&(!search||[o.label,o.id,o.note,...o.items.map(i=>i.name)].join(' ').toLowerCase().includes(search.toLowerCase())))}
function kpis(os){const active=os.filter(o=>o.status!=='取消');return `<div class="stats"><div class="stat"><span class="muted">受付件数</span><div class="value">${active.length}<small> 件</small></div><small>取消を除く注文</small></div><div class="stat"><span class="muted">準備・受渡し待ち</span><div class="value">${active.filter(o=>o.status!=='完了').length}<small> 件</small></div><small>みんなで進めましょう</small></div><div class="stat"><span class="muted">提供完了</span><div class="value">${active.filter(o=>o.status==='完了').reduce((s,o)=>s+C.qty(o),0)}<small> 食・点</small></div><small>完了した注文の数量</small></div><div class="stat"><span class="muted">受付金額</span><div class="value" style="font-size:27px">${money(active.reduce((s,o)=>s+C.total(o),0))}</div><small>取消除外・入金管理は対象外</small></div></div>`}

const THEMES={'学園祭':{accent:'#ff7a2f',soft:'#fff0e6',bg:'#fffbf6',icon:'🏮',desc:'屋台・模擬店の受付に'},'子ども食堂':{accent:'#3eb872',soft:'#e8f8ee',bg:'#f6fdf8',icon:'🍱',desc:'みんなの食卓を支える'},'炊き出し':{accent:'#3a8dde',soft:'#e6f0ff',bg:'#f5f9ff',icon:'🍲',desc:'配食の受付と受渡し'},'地域イベント':{accent:'#e94d8a',soft:'#ffe6f0',bg:'#fffafb',icon:'🥕',desc:'地域のおいしい時間に'}};
function render(){if(!staff)page='order';if(document.body)document.body.classList.toggle('customer',!staff);const theme=THEMES[state.config.kind]||THEMES['学園祭'];if(document.documentElement){for(const [k,v] of Object.entries({accent:theme.accent,soft:theme.soft,bg:theme.bg}))document.documentElement.style.setProperty('--'+k,v);}if($('#brand-icon'))$('#brand-icon').textContent=theme.icon;if($('#kind-tabs'))$('#kind-tabs').innerHTML=Object.entries(THEMES).map(([kind,t])=>`<button data-kind="${kind}" class="${state.config.kind===kind?'active':''}" aria-pressed="${state.config.kind===kind}">${t.icon} ${kind}${state.config.kind===kind?`<span class="kind-desc">${t.desc}</span>`:''}</button>`).join('');const titles={order:'注文を受け付ける',board:'調理・受渡し',list:'記録一覧',report:'集計・グラフ',settings:'設定・データ引継ぎ'};$('#nav').innerHTML=Object.entries(titles).filter(([id])=>staff||id==='order').map(([id,t],i)=>`<button data-page="${id}" class="${page===id?'active':''}">${['▦','◷','☷','▥','⚙'][i]}　${t}</button>`).join('');$('#title').textContent=staff?titles[page]:'ご注文はこちら';if($('#staff-toggle')){$('#staff-toggle').textContent=staff?'顧客注文画面へ':'スタッフ端末';$('#staff-toggle').onclick=()=>{if(staff){alerts.stop();staff=false;page='order';tapCount=0;$('#dialog').close();render();}else staffLogin();};}$('#subtitle').textContent=state.config.name+' ／ '+state.config.kind;$('#mode').textContent=host?'DeltaChat スタッフ共有版':'ブラウザー体験版・この端末に保存';$('#sync').textContent=!ready?'履歴読み込み中':host?(pending.length?'送信確認待ち '+pending.length+'件':'共有履歴を読み込み済み'):'デモ・端末内のみ';$('#sync').className='badge'+(pending.length?' warn':'');$('#app').innerHTML=page==='order'?customerOrdersView()+orderView():page==='board'?boardView():page==='list'?listView():page==='report'?reportView():settingsView();bind();updateAudioStatus();}
function orderView(){const m=state.config.menu,os=state.orders.filter(o=>day(o.at)===day(Date.now())),theme=THEMES[state.config.kind]||THEMES['学園祭'];return `<div class="layout"><section class="panel reception-main"><div class="tools" style="justify-content:space-between"><h2 style="margin:0">📝 新規受付</h2><span class="badge">${esc(state.config.kind)}モード</span></div><div class="order-meta"><div><label for="label">引換番号・テーブル名 <span style="color:#ef4444">*</span></label><input id="label" class="full" maxlength="60" placeholder="例：A-016 ／ テーブル3" value="${esc(window.draftLabel||'')}"></div></div><div class="tools" style="justify-content:space-between;margin:24px 0 12px"><h3>メニュー選択</h3><span class="muted" style="font-size:11px">＋で数量追加</span></div><div class="menu-grid">${m.map(i=>`<article class="food ${cart[i.id]?'selected':''}"><div class="emoji">${esc(i.emoji)}</div><div class="food-info"><h3>${esc(i.name)}</h3><div class="row">${i.price===0?'無料':money(i.price)}　${!i.available?'<span class="badge warn">品切れ</span>':cart[i.id]?`<span class="qty">${cart[i.id]}点 選択中</span>`:''}</div></div><button class="plus" data-add="${esc(i.id)}" aria-label="${esc(i.name)}を追加" ${!i.available?'disabled':''}>${i.available?'+':'×'}</button></article>`).join('')}</div><label for="note" style="margin-top:22px">連絡・配慮メモ</label><textarea id="note" class="note-field" rows="2" maxlength="300" placeholder="例：辛さ控えめ ／ 受渡しは受付カウンター">${esc(window.draftNote||'')}</textarea><div style="margin-top:18px"><h3>今回の注文 <span class="muted">${Object.values(cart).reduce((s,n)=>s+n,0)}点</span></h3>${Object.keys(cart).length?Object.entries(cart).map(([id,n])=>{const i=m.find(i=>i.id===id);return i?`<div class="cart-line"><div>${esc(i.name)} <span class="muted">${money(i.price*n)}</span></div><div class="stepper"><button data-minus="${esc(id)}" aria-label="減らす">−</button><b>${n}</b><button data-add="${esc(id)}" aria-label="増やす">＋</button></div></div>`:''}).join(''):'<div class="muted" style="padding:14px 0">メニューを選んで注文を追加してください。</div>'}</div><div class="total"><span>合計</span><span>${money(Object.entries(cart).reduce((s,[id,n])=>s+(m.find(i=>i.id===id)?.price||0)*n,0))}</span></div>${paymentOrderSelector()}<button class="btn full confirm-order" id="place" ${!ready||!Object.keys(cart).length||busy?'disabled':''}>✓ 注文を登録する</button><p class="muted" style="text-align:center;font-size:11px">注文内容と番号を確認して登録してください。</p></section><aside class="side-stack"><section class="panel sharing-card"><h2>📡 スタッフ共有ステータス</h2><strong><span class="share-dot"></span>${host?'DeltaChatで履歴共有':'ブラウザー体験版'}</strong><div class="sharing-note">${host?`同じチャットの同じアプリを開いたスタッフへ注文と操作履歴を共有します。<br>送信確認待ち：<b>${pending.length}件</b><br>相手の受信完了や端末数を示す表示ではありません。`:'このデモの記録は、このブラウザーに保存します。別端末との共有はDeltaChat用アプリで行います。'}</div><div class="share-metrics"><div><b>${os.filter(o=>o.status!=='取消').length}</b><span>本日の受付</span></div><div><b>${os.filter(o=>!['完了','取消'].includes(o.status)).length}</b><span>対応中</span></div><div><b>${os.filter(o=>o.status==='完了').length}</b><span>受渡し完了</span></div></div></section><section class="panel"><h2 style="font-size:15px">🍱 メニューの販売状況</h2>${m.map(i=>`<div class="availability-row"><span style="font-size:21px">${esc(i.emoji)}</span><span class="name">${esc(i.name)}</span><span class="badge ${i.available?'':'warn'}">${i.available?'受付中':'品切れ'}</span></div>`).join('')}<p class="muted" style="font-size:11px">設定・引継ぎからメニューを変更できます。</p></section><section class="panel tip-card"><h3>💡 みんなで使うときのコツ</h3><ol><li>引換番号を声に出して確認</li><li>配慮事項は厨房と直接確認</li><li>交代時は一覧とJSONで引継ぎ</li></ol></section></aside></div>`}

function listView(){const os=scoped().filter(o=>!filter||o.status===filter);return filters()+`<section class="panel"><div class="tools" style="justify-content:space-between"><h2>注文の記録 <span class="muted">${os.length}件</span></h2><button class="btn secondary" id="csv">表示分をCSV出力</button></div><div class="table-wrap"><table><thead><tr><th>日時・番号</th><th>受付・テーブル</th><th>注文内容</th><th>金額</th><th>状態</th><th>支払記録</th><th>詳細</th></tr></thead><tbody>${os.map(o=>`<tr><td>${day(o.at)} ${time(o.at)}<div class="muted">#${esc(o.id.slice(-8))}</div></td><td>${esc(o.label)}</td><td class="wrap">${o.items.map(i=>esc(i.name)+' ×'+i.qty).join('、')}</td><td>${money(C.total(o))}</td><td><span class="badge ${o.status==='取消'?'warn':''}">${o.status}</span></td><td>${paymentBadge(o)}<br><button class="btn secondary" data-payment="${esc(o.id)}">会計</button></td><td><button class="btn secondary" data-detail="${esc(o.id)}">開く</button></td></tr>`).join('')}</tbody></table>${!os.length?'<div class="empty">条件に合う記録はありません</div>':''}</div></section>`}
function reportView(){const os=scoped(),active=os.filter(o=>o.status!=='取消'),items={};for(const o of active)for(const i of o.items)items[i.name]=(items[i.name]||0)+i.qty;const rows=Object.entries(items).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...rows.map(x=>x[1]));const hours=Array.from({length:24},(_,h)=>active.filter(o=>new Date(o.at).getHours()===h).length),hm=Math.max(1,...hours);return filters()+kpis(os)+paymentReportView(os)+`<div class="charts"><section class="panel"><h2>メニュー別 受付数量</h2><div class="muted">取消を除く・単位：食／点</div><div class="bars">${rows.map(([n,q])=>`<div class="bar-row"><span>${esc(n)}</span><div class="track"><div class="fill" style="width:${q/max*100}%"></div></div><b>${q}</b></div>`).join('')||'<div class="empty">まだ集計データがありません</div>'}</div></section><section class="panel"><h2>状態別 注文件数</h2><div class="bars">${C.ST.map((s,i)=>{const n=os.filter(o=>o.status===s).length;return `<div class="bar-row"><span>${s}</span><div class="track"><div class="fill" style="width:${n/Math.max(1,os.length)*100}%;background:${['#d9ad5a','#df916c','#75a893','#2d795a','#b8bdb5'][i]}"></div></div><b>${n}件</b></div>`}).join('')}</div></section><section class="panel" style="grid-column:1/-1"><h2>時間帯別 受付件数</h2><div class="muted">端末の現地時刻・取消を除く</div><div class="hourly">${hours.map((n,h)=>`<div class="hour" title="${h}時 ${n}件"><span>${n||''}</span><div class="column" style="height:${n/hm*115}px"></div>${h}</div>`).join('')}</div></section></div>`}
function settingsView(){return accessSettings()+audioSettings()+paymentSettingsView()+`<div class="settings"><section class="panel"><h2>開催情報・メニュー</h2><label for="event-name">開催名</label><input id="event-name" class="full" maxlength="60" value="${esc(state.config.name)}"><label for="kind">用途</label><select id="kind" class="full">${['地域イベント','学園祭','子ども食堂','炊き出し'].map(k=>`<option ${state.config.kind===k?'selected':''}>${k}</option>`).join('')}</select><label>メニュー（絵文字／名前／円／販売）</label><div id="menu-editor">${state.config.menu.map(i=>menuRow(i)).join('')}</div><button class="btn secondary" id="add-menu">＋ メニューを追加</button><button class="btn full" id="save-config" style="margin-top:20px" ${!ready?'disabled':''}>設定を保存・共有</button><p class="muted">変更は今後の注文に反映します。過去の注文の価格・名称は変わりません。共有版はスタッフ全員に設定が配布されます。</p></section><div><section class="panel"><h2>データを次の担当者へ</h2><p class="muted">全注文・状態変更履歴・開催設定をJSONに保存します。新しい版へ移るときも利用できます。</p><button class="btn full" id="export">JSONを書き出す</button><label for="import">引継ぎJSONを選ぶ</label><input id="import" type="file" accept=".json,application/json" class="full"><div class="notice">読込みは既存記録への追加・統合です。同じ記録は重複しません。共有版では読んだ記録をスタッフのチャットに配布します。最新の設定は履歴の順序で決まります。</div><label for="jsonpaste">ファイルを選べない場合はJSONを貼付け</label><textarea id="jsonpaste" rows="3" placeholder="JSON全文"></textarea><button class="btn secondary full" id="paste-import">貼り付けたJSONを読み込む</button><button class="btn secondary full" id="retry" style="margin-top:12px">送信確認待ちを再送</button></section><section class="panel" style="margin-top:20px"><h2>この端末の表示名</h2>${host?`<p>${esc(actor())}</p><p class="muted">DeltaChatの表示名を使います。</p>`:`<input id="staff-name" maxlength="80" class="full" value="${esc(actor())}"><button class="btn secondary" id="save-name" style="margin-top:10px">保存</button><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><button class="btn secondary" id="samples">見本データを追加</button><button class="btn danger" id="reset">デモ記録を全消去</button>`}</section></div></div>`}
function menuRow(i){return `<div class="menu-edit" data-id="${esc(i.id)}"><input class="m-emoji" aria-label="絵文字" maxlength="10" value="${esc(i.emoji)}"><input class="m-name" aria-label="メニュー名" maxlength="80" value="${esc(i.name)}"><input class="m-price" aria-label="価格" type="number" min="0" max="1000000" step="1" value="${i.price}"><label style="margin:0;font-size:11px"><input class="m-available" type="checkbox" ${i.available?'checked':''}>販売</label><button class="remove-menu" aria-label="メニューを削除">×</button></div>`}
function modal(html){$('#dialog-body').innerHTML=html;$('#dialog').showModal()}
function details(id){if(!staff)return;const o=state.orders.find(o=>o.id===id);if(!o)return;modal(`<h2>${esc(o.label)} <span class="badge">${o.status}</span></h2><p class="muted">注文ID：${esc(o.id)}</p><ul>${o.items.map(i=>`<li>${esc(i.name)} ×${i.qty} ／ ${money(i.price*i.qty)}</li>`).join('')}</ul><p>${esc(o.note)}</p><strong>合計 ${money(C.total(o))}</strong><p>${paymentBadge(o)}</p><button class="btn secondary full" data-payment="${esc(o.id)}">会計・支払確認</button><label>状態を訂正</label><select id="detail-status" class="full">${C.ST.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select><button class="btn full" id="detail-save" style="margin:12px 0">状態を記録する</button><p class="muted">数量・内容の変更は、この注文を取消にして新しい注文を登録してください。</p><h3>操作履歴</h3>${o.history.map(h=>`<div class="history">${day(h.at)} ${time(h.at)}　${esc(h.actor)} → ${h.status}</div>`).join('')}`);bindPayments();$('#detail-save').onclick=()=>{const s=$('#detail-status').value;if(s===o.status)return;if(!confirm('「'+s+'」に変更しますか？'+(s==='取消'&&C.paymentView(o).status==='paid'?' 入金確認済みのため返金待ちになります。実際の返金は別途行ってください。':'')))return;submit([event('status',{orderId:id,status:s})]);$('#dialog').close();toast(host?'状態変更を送信確認待ちに追加しました':'状態を更新しました')}}
async function output(name,text){try{if(host){await webxdc.sendToChat({file:{name,plainText:text}});toast('添付の送信を確定すると保存されます。')}else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('ファイルを書き出しました')}}catch(e){toast('書出しに失敗しました：'+e.message)}}
function exportJSON(){output('machimeshi-'+day(Date.now())+'.json',JSON.stringify({schema:'machimeshi/1',exportedAt:new Date().toISOString(),events:[...events,...pending.filter(e=>!events.some(x=>x.id===e.id))]},null,2))}
function importJSON(text){try{if(new TextEncoder().encode(text).length>8*1024*1024)throw Error('8MB以下のファイルを選んでください。');const es=C.backup(text),known=new Set([...events,...pending].map(e=>e.id)),fresh=es.filter(e=>!known.has(e.id));if(!fresh.length){toast('すべて読込み済みです。');return}if(!confirm(fresh.length+'件の履歴を追加します。'+(host?'このチャットの全スタッフへ共有します。':'')+'よろしいですか？'))return;clock=Math.max(clock,...es.map(e=>e.clock));submit(fresh.map(e=>({...e,notificationSilent:true})));toast(host?'引継ぎ履歴を送信確認待ちに追加しました':'データを引き継ぎました')}catch(e){toast('読込みできません：'+e.message)}}
function csv(){const os=scoped().filter(o=>!filter||o.status===filter),cell=v=>'"'+String(typeof v==='string'&&/^[=+@\-\t\r]/.test(v)?"'"+v:v).replace(/"/g,'""')+'"';const rows=[['注文ID','受付日時','受付・テーブル','状態','メニュー','単価','数量','小計','注文合計','担当者','メモ','支払方法','支払状態','会計確認担当','会計確認日時','現金預かり','現金お釣り','店舗決済番号']];for(const o of os)for(const i of o.items)rows.push([o.id,day(o.at)+' '+time(o.at),o.label,o.status,i.name,i.price,i.qty,i.price*i.qty,C.total(o),o.actor,o.note,C.paymentView(o).method.name,C.paymentView(o).label,o.payment.actor||'',o.payment.at?new Date(o.payment.at).toISOString():'',o.payment.cashReceived??'',C.paymentView(o).cashChange??'',o.payment.reference||'']);output('machimeshi-orders.csv','\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n'))}

if($('#audio-settings'))$('#audio-settings').onsubmit=e=>{e.preventDefault();if(!staff)return;try{alerts.configure({order:$('#audio-order').checked,ready:$('#audio-ready').checked,volume:Number($('#audio-volume').value)});void alerts.unlock();toast('この端末の通知音設定を保存しました。');}catch(e){toast('保存できません：'+e.message);}};
if($('#audio-volume'))$('#audio-volume').oninput=e=>{$('#audio-volume-value').textContent=e.target.value;};
for(const kind of ['order','ready']){const b=$('#test-'+kind+'-sound');if(b)b.onclick=async()=>{if(!staff)return;const a=alerts.settings;if(!a[kind]||a.volume===0){toast('この音はオフまたは音量0％です。設定を保存してから試してください。');return;}if(await alerts.unlock()){alerts.stop();alerts.play(kind);}else toast('再生できません。端末の音量・再生設定を確認してください。');};}
if($('#access-settings'))$('#access-settings').onsubmit=e=>{e.preventDefault();if(!staff)return;const taps=Number($('#access-taps').value),password=$('#access-new').value;if($('#access-current').value!==access.password){toast('現在のパスワードが違います。');return;}if(!Number.isInteger(taps)||taps<1||taps>20){toast('タップ回数は1〜20の整数にしてください。');return;}if(password!==$('#access-confirm').value||password&&(password.length<4||password.length>128)){toast('新しいパスワードと確認欄を一致させてください（4〜128文字）。');return;}const next={taps,password:password||access.password};try{localStorage.setItem(ACCESS_KEY,JSON.stringify(next));access=next;tapCount=0;render();toast('この端末の切替設定を保存しました。');}catch{toast('保存できません。端末の保存設定を確認してください。');}};document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{if(!staff||!ready)return;const kind=b.dataset.kind;if(kind===state.config.kind)return;if(!confirm('用途を「'+kind+'」に変更します。メニューと記録は維持します。'+(host?'変更をスタッフへ共有します。':'')))return;submit([event('config',{config:{...state.config,kind}})]);toast('用途を変更しました。メニューは設定から変更できます。')});document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{if(!staff&&b.dataset.page!=='order')return;page=b.dataset.page;render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const id=b.dataset.add;if((cart[id]||0)>=999)return;cart[id]=(cart[id]||0)+1;render()});document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{if(--cart[b.dataset.minus]<=0)delete cart[b.dataset.minus];render()});document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>details(b.dataset.detail));document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{const o=state.orders.find(o=>o.id===b.dataset.next);if(o.status==='受渡し待ち'&&C.paymentView(o).status==='unpaid'&&!confirm('支払記録が未払いです。確認のうえ受渡し完了にしますか？'))return;submit([event('status',{orderId:o.id,status:C.ST[C.ST.indexOf(o.status)+1]})]);toast(host?'変更を送信確認待ちに追加しました':'状態を更新しました')});if($('#label'))$('#label').oninput=e=>window.draftLabel=e.target.value;if($('#note'))$('#note').oninput=e=>window.draftNote=e.target.value;
if($('#place'))$('#place').onclick=()=>{void alerts.unlock();const label=$('#label').value.trim(),note=$('#note').value.trim();if(!label){toast('受付番号・テーブル名を入力してください。');$('#label').focus();return}const items=Object.entries(cart).map(([id,qty])=>({...state.config.menu.find(i=>i.id===id),qty}));if(items.some(i=>!i.available||!i.id)){toast('メニューの販売状況が変わりました。注文を選び直してください。');cart={};render();return}const methodId=$('#order-payment-method')?.value||window.draftPaymentMethod||state.paymentOptions.find(o=>o.enabled)?.id||'unspecified';const paymentMethod=C.method(methodId);if(items.reduce((n,i)=>n+i.price*i.qty,0)>0&&!state.paymentOptions.some(o=>o.id===methodId&&o.enabled)){toast('支払方法が変更されました。利用できる方法を選んでください。');render();return;}busy=true;try{submit([event('order',{orderId:uid(),label,note,items,paymentMethod,...(staff?{}:{customerId:alerts.customerId})})]);cart={};window.draftLabel='';window.draftNote='';toast(host?'注文を送信確認待ちに追加しました。厨房の表示で到達を確認してください。':'注文を受け付けました。調理・受渡し画面で確認できます。')}catch(e){toast(e.message)}finally{busy=false;render()}};
if($('#search'))$('#search').onchange=e=>{search=e.target.value;render()};if($('#date'))$('#date').onchange=e=>{date=e.target.value;render()};if($('#status-filter'))$('#status-filter').onchange=e=>{filter=e.target.value;render()};if($('[data-action="clearfilter"]'))$('[data-action="clearfilter"]').onclick=()=>{date='';search='';filter='';render()};if($('#csv'))$('#csv').onclick=csv;
if($('#export'))$('#export').onclick=exportJSON;if($('#import'))$('#import').onchange=async e=>{const f=e.target.files[0];if(f){if(f.size>8*1024*1024){toast('8MB以下を選んでください');return}importJSON(await f.text())}};if($('#paste-import'))$('#paste-import').onclick=()=>importJSON($('#jsonpaste').value);if($('#retry'))$('#retry').onclick=()=>{lastSend=0;flush();toast(host?'再送を要求しました。相手の画面も確認してください。':'デモはこの端末だけに保存されます。')};if($('#save-name'))$('#save-name').onclick=()=>{localStorage.setItem('machimeshi-name',$('#staff-name').value.trim()||'スタッフ');toast('表示名を保存しました')};if($('#samples'))$('#samples').onclick=()=>{if(confirm('見本の注文を追加しますか？'))samples()};if($('#reset'))$('#reset').onclick=()=>{if(confirm('このブラウザーのデモ記録をすべて消去します。必要なJSONは保存しましたか？')){events=[];cart={};clock=0;state=C.reduce([]);persist();render()}};
if($('#add-menu'))$('#add-menu').onclick=()=>{if(document.querySelectorAll('.menu-edit').length>=50)return;$('#menu-editor').insertAdjacentHTML('beforeend',menuRow({id:uid(),name:'',price:0,emoji:'🍽️',available:true}));bindRemove()};bindRemove();if($('#save-config'))$('#save-config').onclick=()=>{const config={name:$('#event-name').value.trim(),kind:$('#kind').value,menu:[...document.querySelectorAll('.menu-edit')].map(r=>({id:r.dataset.id,name:r.querySelector('.m-name').value.trim(),emoji:r.querySelector('.m-emoji').value,price:Number(r.querySelector('.m-price').value),available:r.querySelector('.m-available').checked}))};const e=event('config',{config});if(!config.name||!C.valid(e)){toast('開催名・メニュー名・0〜1,000,000円の整数価格を確認してください。');return}submit([e]);cart={};toast(host?'設定を送信確認待ちに追加しました':'設定を保存しました')};}

function samples(){const es=[];for(let n=0;n<18;n++){const e=event('order',{orderId:'demo-'+uid(),label:n%3?'テーブル '+(n%6+1):'受付 '+(n+1),note:n===2?'受渡しは受付カウンター':'',items:[{...C.defaults.menu[n%4],qty:n%3+1}]});e.at=Date.now()-(18-n)*6*60000;es.push(e);if(n%5){const s=event('status',{orderId:e.orderId,status:C.ST[Math.min(n%5,3)]});s.at=e.at+60000;es.push(s)}}merge(es.map(e=>({...e,notificationSilent:true})))}
$('#close-dialog').onclick=()=>$('#dialog').close();$('#help').onclick=()=>modal(`<h2>まちめしの使い方</h2><p>① 設定で開催名・メニュー・価格を登録します。無料配食は価格を0円にしてください。</p><p>② 注文受付でメニュー・数量・受付番号を入力します。</p><p>③ 調理・受渡しで「受付済み → 調理中 → 受渡し待ち → 完了」と進めます。</p><p>④ 一覧から取消・訂正、CSV出力。集計で数量や時間帯を確認できます。</p><p>⑤ JSONを書き出し、新しい版や次の担当者が読み込むと記録を引き継げます。</p><p>⑥ スタッフ設定で利用する支払方法と店舗の正式なQR画像を登録できます。会計画面で現金の預かり金・お釣り、支払済み・返金の記録を残します。</p><p>⑦ スタッフ設定で通知音を変更できます。新規注文はスタッフへ、受渡し待ちはスタッフと注文した顧客端末へ音で知らせます。「音を有効にする」が表示されたら押してください。閉じたアプリを呼び出すプッシュ通知ではありません。</p><div class="notice">共有版はスタッフ専用グループの同じ1件のアプリを開いて使います。全記録がグループ全員に配布されます。起動時は顧客注文画面です。「スタッフ端末」を既定1回タップし、パスワードを入力するとスタッフ画面に切り替わります。初期パスワードは1234です。設定で端末ごとに変更してください。この切替は画面操作の制限で、端末内データやチャット履歴へのアクセスを保護するものではありません。</div><p class="muted">送信確認待ちは相手への到達保証ではありません。通信がない間は他端末へ届きません。厨房で表示を確認して作業してください。会計は店舗での支払結果をスタッフが手動記録します。決済・返金の自動処理や在庫の確保は行いません。同時の状態変更は論理時刻とIDの順で決定し、履歴に残します。</p>`);
(async()=>{try{if(host){pending=JSON.parse(localStorage.getItem(PENDING)||'[]').filter(C.valid);clock=Math.max(0,...pending.map(e=>e.clock));render();await webxdc.setUpdateListener(update=>{if(update.payload?.app==='machimeshi/1'&&Array.isArray(update.payload.events)){merge(update.payload.events);if(ready)setTimeout(flush,20)}},0);ready=true;render();flush()}else{events=JSON.parse(localStorage.getItem(KEY)||'[]').filter(C.valid);clock=Math.max(0,...events.map(e=>e.clock));state=C.reduce(events);render()}}catch(e){ready=false;render();toast('読込みに失敗しました：'+e.message)}})();
